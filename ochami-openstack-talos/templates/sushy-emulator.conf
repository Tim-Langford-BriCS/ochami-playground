# sushy-emulator.conf — a virtual Redfish BMC for ONE node (appendix A).
#
# Run one process per node, each with its own copy of this file, so that every
# node has a distinct single-system BMC endpoint — as real hardware does.
#
#   head$ sushy-emulator --config ~/sushy/etc/tw-cp1.conf
# or via the systemd template in appendix A §A.4:
#   head$ sudo systemctl enable --now sushy-emulator@tw-cp1
#
# ─── Why this file is interesting ────────────────────────────────────────────
# The OpenStack driver implements the Redfish operation
#     BootSourceOverrideTarget = Pxe   +   ComputerSystem.Reset
# by putting the Nova instance into RESCUE mode with an iPXE image — which is
# exactly what §7.5 did by hand with `openstack server rescue`. So this file
# does not introduce a new mechanism; it puts a standard API in front of the
# one you already used.

# ─── Driver ──────────────────────────────────────────────────────────────────
# Enables the OpenStack driver. Value is a clouds.yaml entry name, which must
# exist in ~/.config/openstack/clouds.yaml on this host and be readable by the
# user the emulator runs as.
#
# ⚠ This gives the head node credentials that can create and destroy instances
#   in the project. Use a SEPARATE application credential from your own (§1.2),
#   scoped to `member`, with an expiry — so revoking it doesn't break your
#   workflow. See the 🛑 box in appendix A §A.1.
SUSHY_EMULATOR_OS_CLOUD = 'techwatch'

# ─── One BMC, one system ─────────────────────────────────────────────────────
# Without this, the emulator exposes EVERY instance it can see at one endpoint —
# convenient, but not how hardware works, and not what Magellan expects. Listing
# exactly one instance UUID makes this endpoint a faithful single-system BMC.
#
# Get UUIDs with:  openstack server list -c Name -c ID -f value | grep ^tw-
SUSHY_EMULATOR_ALLOWED_INSTANCES = ['<INSTANCE_UUID>']

# ─── PXE boot via Nova rescue ────────────────────────────────────────────────
SUSHY_EMULATOR_OS_RESCUE_PXE_BOOT = True

# The Glance image to rescue with. Both point at the same image because iPXE's
# prebuilt ipxe.iso boots under legacy BIOS *and* UEFI (§7.1); set only the one
# that matches if your cloud uses a single firmware type.
SUSHY_EMULATOR_OS_RESCUE_PXE_IMAGE_BIOS = 'tw-ipxe'
SUSHY_EMULATOR_OS_RESCUE_PXE_IMAGE_UEFI = 'tw-ipxe'

# ─── State ───────────────────────────────────────────────────────────────────
# Boot overrides ("PXE once, then back to disk") must survive an emulator
# restart. One directory per node — sharing it between processes corrupts state.
SUSHY_EMULATOR_STATE_DIR = '/var/lib/sushy-emulator/<NODE_NAME>'

# ─── Listener ────────────────────────────────────────────────────────────────
# Bind to the provisioning wire only. A BMC is a management interface and must
# never face a network you don't own — the same rule as CoreDHCP's
# `listen: "%<prov-if>"` in §5.7.
#
# One port per node: 8000, 8001, 8002, …
# More faithful alternative: bind an extra address per node to the head's
# provisioning interface (172.16.0.101, .102, … — the addresses §6's placeholder
# `bmcs:` entries already claim) and use port 443 on each.
SUSHY_EMULATOR_LISTEN_IP = '172.16.0.254'
SUSHY_EMULATOR_LISTEN_PORT = 8000

# ─── TLS (recommended, not required here) ────────────────────────────────────
# We run plain HTTP because the provisioning wire is isolated. On the PTR, BMCs
# use TLS and require authentication, and Magellan expects to supply credentials
# (`magellan collect --username --password`). Enabling these here rehearses that
# half of the problem, which is worth doing:
#
# SUSHY_EMULATOR_SSL_CERT = '/etc/sushy/cert.pem'
# SUSHY_EMULATOR_SSL_KEY  = '/etc/sushy/key.pem'
