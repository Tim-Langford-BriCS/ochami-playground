# nodes.yaml — the SMD inventory (§6.1).
#
# Load with:
#   head$ export DEMO_ACCESS_TOKEN=$(sudo bash -lc 'gen_access_token')
#   head$ ochami discover static -f yaml -d @/etc/openchami/data/nodes.yaml
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THE THREE-WAY CONTRACT (§6)                                              │
# │ The MAC addresses below must match, exactly:                             │
# │   1. the Neutron ports created in §3.4  (openstack port create --mac-…)  │
# │   2. this file                                                           │
# │   3. the BSS boot payloads in §9.1                                       │
# │ Disagreement fails silently: a node gets a 172.16.0.2xx bootloop lease,  │
# │ or boots the wrong role. Check all three before §10.                     │
# └──────────────────────────────────────────────────────────────────────────┘
#
# The bmcs: entries are PLACEHOLDERS. Our Nova instances have no BMCs, so these
# invented MAC/IP pairs exist only to satisfy the schema. Appendix A replaces
# them with sushy-tools endpoints that Magellan can genuinely discover, which is
# the closest this POC gets to the PTR.
#
# Note the format: current `ochami` wants separate `bmcs:` and `nodes:` lists.
# The pre-v0.6.0 flat form (bmc_mac:/bmc_ip: inline per node) shown in the older
# upstream guide is rejected.

bmcs:
- xname: x1000c0s0b0
  mac: de:ca:fc:0f:fe:e1
  ip: 172.16.0.101
- xname: x1000c0s0b1
  mac: de:ca:fc:0f:fe:e2
  ip: 172.16.0.102
- xname: x1000c0s0b2
  mac: de:ca:fc:0f:fe:e3
  ip: 172.16.0.103
- xname: x1000c0s0b3
  mac: de:ca:fc:0f:fe:e4
  ip: 172.16.0.104
- xname: x1000c0s0b4
  mac: de:ca:fc:0f:fe:e5
  ip: 172.16.0.105

nodes:
# ── Kubernetes control plane ────────────────────────────────────────────────
- name: tw-cp1
  nid: 1
  xname: x1000c0s0b0n0
  bmc: x1000c0s0b0
  groups:
  - compute
  - talos-controlplane
  interfaces:
  - mac_addr: 52:54:00:be:ef:01
    ip_addrs:
    - name: management
      ip_addr: 172.16.0.1

# ── Kubernetes workers ──────────────────────────────────────────────────────
- name: tw-w1
  nid: 2
  xname: x1000c0s0b1n0
  bmc: x1000c0s0b1
  groups:
  - compute
  - talos-worker
  interfaces:
  - mac_addr: 52:54:00:be:ef:02
    ip_addrs:
    - name: management
      ip_addr: 172.16.0.2
- name: tw-w2
  nid: 3
  xname: x1000c0s0b2n0
  bmc: x1000c0s0b2
  groups:
  - compute
  - talos-worker
  interfaces:
  - mac_addr: 52:54:00:be:ef:03
    ip_addrs:
    - name: management
      ip_addr: 172.16.0.3
- name: tw-w3
  nid: 4
  xname: x1000c0s0b3n0
  bmc: x1000c0s0b3
  groups:
  - compute
  - talos-worker
  interfaces:
  - mac_addr: 52:54:00:be:ef:04
    ip_addrs:
    - name: management
      ip_addr: 172.16.0.4
- name: tw-w4
  nid: 5
  xname: x1000c0s0b4n0
  bmc: x1000c0s0b4
  groups:
  - compute
  - talos-worker
  interfaces:
  - mac_addr: 52:54:00:be:ef:05
    ip_addrs:
    - name: management
      ip_addr: 172.16.0.5
